spring.application.name=appointment-service
server.port=8083

# MySQL Config
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthcare_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Actuator: health endpoints for the Kubernetes liveness and readiness probes.
# Readiness also checks the database, so a pod gets traffic only when MySQL is reachable.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
