name: CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - appointment-service
          - doctor_service/doctor_service
          - patient-service

    # The tests run on an in-memory H2 database (src/test/resources/application.properties).
    # The Docker Compose smoke test below runs the services against MySQL.
    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    name: Build medisync-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medisync-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medisync-frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npx ng build --configuration production

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4

      - name: Build the images and start the stack
        run: docker compose up -d --build

      - name: Wait until every service answers
        run: |
          for svc in 8081:patients 8082:doctors 8083:appointments; do
            port=${svc%%:*}; path=/api/${svc##*:}; code=000
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port$path" || true)
              [ "$code" != "000" ] && break
              sleep 3
            done
            echo "GET localhost:$port$path -> HTTP $code"
            case "$code" in 000|5*) exit 1;; esac
          done

      - name: Show the logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  kubernetes:
    name: Kubernetes deploy test (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: medisync

      - name: Build the images and load them into the cluster
        run: |
          docker build -t medisync/patient-service:latest patient-service
          docker build -t medisync/doctor-service:latest doctor_service/doctor_service
          docker build -t medisync/appointment-service:latest appointment-service
          kind load docker-image --name medisync medisync/patient-service:latest medisync/doctor-service:latest medisync/appointment-service:latest

      - name: Deploy the manifests
        run: |
          kubectl create secret generic medisync-db --from-literal=password=ci-password
          kubectl apply -k k8s/
          kubectl rollout status deployment/mysql --timeout=300s
          for d in patient-service doctor-service appointment-service; do
            kubectl rollout status deployment/$d --timeout=420s
          done

      - name: Call each service through its Kubernetes Service
        run: |
          for svc in patient-service:8081:patients doctor-service:8082:doctors appointment-service:8083:appointments; do
            IFS=: read -r name port path <<< "$svc"
            kubectl run "curl-$name" --rm -i --restart=Never --image=curlimages/curl:8.10.1 -- \
              -sf -o /dev/null -w "GET http://$name:$port/api/$path -> HTTP %{http_code}\n" "http://$name:$port/api/$path"
          done

      - name: Show the pods and logs
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l app --all-containers --tail=100 || true
