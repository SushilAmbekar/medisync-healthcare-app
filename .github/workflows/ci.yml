name: CI

on:
  push:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - appointment-service
          - doctor_service/doctor_service
          - patient-service

    # The services' context-load tests connect to MySQL, as the application does.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
          MYSQL_DATABASE: healthcare_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/healthcare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ci-password

    defaults:
      run:
        working-directory: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Build and test
        run: ./mvnw -B -ntp verify

  frontend:
    name: Build medisync-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medisync-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: medisync-frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npx ng build --configuration production

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-password
    steps:
      - uses: actions/checkout@v4

      - name: Build the images and start the stack
        run: docker compose up -d --build

      - name: Wait until every service answers
        run: |
          for svc in 8081:patients 8082:doctors 8083:appointments; do
            port=${svc%%:*}; path=/api/${svc##*:}; code=000
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$port$path" || true)
              [ "$code" != "000" ] && break
              sleep 3
            done
            echo "GET localhost:$port$path -> HTTP $code"
            case "$code" in 000|5*) exit 1;; esac
          done

      - name: Show the logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
